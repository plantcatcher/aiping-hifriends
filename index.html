<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="HiFriends - AI角色语音对话应用。与Steve Jobs、爱因斯坦、马斯克、樊振东等名人角色实时语音聊天，支持声音克隆、长期记忆、自定义角色。">
  <meta name="keywords" content="AI对话,AI角色,语音聊天,声音克隆,Steve Jobs,爱因斯坦,马斯克,樊振东,DeepSeek,CosyVoice2">
  <meta name="author" content="HiFriends">
  <meta name="theme-color" content="#0a0a0f">
  <meta property="og:title" content="HiFriends - AI角色语音对话">
  <meta property="og:description" content="与你最喜欢的角色实时语音交谈。支持名人角色、声音克隆、自定义人设。">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="HiFriends - AI角色语音对话">
  <meta name="twitter:description" content="与你最喜欢的角色实时语音交谈。">
  <title>HiFriends - 和你最喜欢的角色交谈 | AI角色语音对话</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6E270YGYEF"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-6E270YGYEF');
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
  <div class="app">
    <!-- 顶部信息 -->
    <header class="top-bar">
      <div class="app-info">
        <h1>HiFriends</h1>
        <p>和你的 AI 朋友打电话</p>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="memoryBtn" title="长期记忆">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </button>
        <button class="icon-btn" id="allCharactersBtn" title="所有角色">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5"/>
            <rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/>
            <rect x="14" y="14" width="7" height="7" rx="1.5"/>
          </svg>
        </button>
        <button class="icon-btn" id="settingsBtn" title="设置">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 通话主区域 -->
    <main class="call-area">
      <!-- 控件集群：单控件 = 点击说话 / 再次点击暂停（含状态光球 + 麦克风图标） -->
      <div class="control-cluster" id="controlCluster">
        <div class="orb-pulse-rings">
          <div class="orb-pulse-ring"></div>
          <div class="orb-pulse-ring"></div>
          <div class="orb-pulse-ring"></div>
        </div>
        <button class="status-orb" id="statusOrb" title="点击开始通话">
          <!-- 麦克风图标独立容器：不碰 WebGL canvas，光球动效保留 -->
          <div class="orb-mic-icon" id="orbMicIcon"></div>
        </button>
      </div>

      <!-- 状态文字 -->
      <div class="status" id="status">点击麦克风开始通话</div>

      <!-- 实时字幕 -->
      <div class="subtitle" id="subtitle">
        <span class="subtitle-user" id="subtitleUser"></span>
        <span class="subtitle-ai" id="subtitleAI"></span>
      </div>
    </main>

    <!-- 对话记录面板 -->
    <div class="transcript-panel" id="transcriptPanel">
      <div class="transcript-header">
        <button class="icon-btn small" id="exportTranscriptBtn" title="导出对话">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </button>
        <button class="icon-btn small" id="clearTranscriptBtn" title="清空">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
        </button>
      </div>
      <div class="transcript-list" id="transcriptList"></div>
    </div>

    <!-- 记忆面板 -->
    <div class="memory-panel" id="memoryPanel">
      <div class="memory-header">
        <span class="memory-title">长期记忆</span>
        <span class="memory-count" id="memoryCount"></span>
        <button class="icon-btn small" id="clearMemoryBtn" title="清空记忆">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
        </button>
      </div>
      <div class="memory-list" id="memoryList"></div>
    </div>

    <!-- 文字输入栏 -->
    <div class="text-input-bar" id="textInputBar">
      <input type="text" id="textInput" placeholder="输入文字和 TA 聊天…" maxlength="500" autocomplete="off" enterkeyhint="send">
      <button class="send-btn" id="sendBtn" title="发送" aria-label="发送">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"/>
          <polyline points="5 12 12 5 19 12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- 右侧人物形象面板 -->
  <div class="image-panel" id="imagePanel">
    <!-- 微信通话式角色标识（图上方） -->
    <div class="call-identity">
      <div class="call-name-row">
        <div class="call-name" id="callName" title="点击编辑名称">Helen</div>
        <input type="text" id="callNameInput" class="call-name-input hidden" maxlength="12" autocomplete="off">
        <button class="char-download-badge" id="charDownloadBadge" title="素材下载状态"></button>
      </div>
    </div>
    <!-- disablepictureinpicture + controlslist 禁用浏览器媒体浮层（画中画/翻译音频） -->
    <video src="assets/girlfriend.mp4" class="side-video" id="sideVideo" autoplay muted loop playsinline preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate nofullscreen"></video>
    <div class="image-panel-overlay"></div>
  </div>

  <!-- 左右切换按钮（放 .layout 直接子级：手机端 .app 覆盖全屏会拦截 image-panel 内的点击） -->
  <button class="char-nav char-nav-left" id="charPrev" title="上一个">‹</button>
  <button class="char-nav char-nav-right" id="charNext" title="下一个">›</button>
  </div>

  <!-- 设置弹窗 -->
  <div class="modal-overlay" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal">
      <div class="modal-header">
        <h2 id="settingsTitle">设置</h2>
        <button class="icon-btn" id="closeSettingsBtn">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="switch-label">
            <span>允许打断（说话时停止AI语音）</span>
            <input type="checkbox" id="interruptToggle">
            <span class="switch"></span>
          </label>
        </div>

        <div class="form-group">
          <label class="switch-label">
            <span>长期记忆（记住你说过的话）</span>
            <input type="checkbox" id="memoryToggle" checked>
            <span class="switch"></span>
          </label>
        </div>

        <div class="form-group">
          <label class="switch-label">
            <span>原声音色克隆（名人角色用原声）</span>
            <input type="checkbox" id="voiceCloneToggle" checked>
            <span class="switch"></span>
          </label>
        </div>

        <div class="form-group">
          <div class="test-section-label">连接测试</div>
          <div class="test-btn-row">
            <button class="btn-secondary" id="testBtn">测试 DeepSeek</button>
            <button class="btn-secondary" id="testSFBtn">测试语音合成</button>
            <button class="btn-secondary" id="testCloneBtn">测试声音克隆</button>
          </div>
          <div class="test-result-box" id="testResult"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-primary" id="saveSettingsBtn">保存设置</button>
      </div>
    </div>
  </div>

  <!-- 所有角色页面（全屏覆盖层） -->
  <div class="characters-page" id="charactersPage" role="dialog" aria-modal="true" aria-label="所有角色">
    <div class="characters-page-header">
      <h2>所有角色</h2>
      <div class="char-search-bar">
        <svg class="char-search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="charSearchInput" placeholder="搜索角色名、人设关键词…" autocomplete="off">
      </div>
      <div class="characters-page-actions">
        <button class="btn-secondary btn-sm" id="pageAddCharBtn">+ 新建角色</button>
        <button class="icon-btn" id="closeCharactersBtn" title="关闭">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="characters-page-body">
      <div class="char-section-title">默认角色</div>
      <div class="char-grid" id="charGridPresets"></div>
      <div class="char-section-title">我创建的角色</div>
      <div class="char-grid" id="charGridCustom"></div>
    </div>
  </div>

  <!-- 角色编辑侧滑面板（嵌于角色页面内） -->
  <div class="char-edit-panel-overlay" id="characterModal">
    <div class="char-edit-panel">
      <div class="edit-panel-header">
        <h2 id="characterModalTitle">创建角色</h2>
        <button class="icon-btn" id="closeCharacterBtn">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="edit-panel-body">
        <div class="form-group">
          <label>角色名称</label>
          <input type="text" id="charNameInput" placeholder="给角色起个名字" maxlength="12">
        </div>
        <div class="form-group">
          <label>角色参考图</label>
          <div id="charMediaPicker"></div>
          <small>上传或粘贴参考图；留空则按描述自动生成形象</small>
        </div>
        <div class="form-group">
          <label>描述人物</label>
          <textarea id="charPromptInput" rows="5" placeholder="TA 是谁、什么性格、怎么说话…"></textarea>
        </div>
        <div class="form-group">
          <label>音色 <span class="voice-lock-hint" id="voiceLockHint"></span></label>
          <select id="charVoiceSelect"></select>
          <small id="charVoiceFileHint" class="voice-file-hint hidden"></small>
        </div>
      </div>
      <div class="edit-panel-footer">
        <button class="btn-danger hidden" id="deleteCharacterBtn">删除人物</button>
        <div class="footer-spacer"></div>
        <button class="btn-primary" id="saveCharacterBtn">创建</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js" defer></script>
</body>
</html>
